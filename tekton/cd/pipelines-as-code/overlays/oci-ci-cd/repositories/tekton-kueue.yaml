---
apiVersion: v1
kind: Namespace
metadata:
  name: releases-tekton-kueue
---
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: tektoncd-tekton-kueue
  namespace: releases-tekton-kueue
spec:
  url: https://github.com/tektoncd/tekton-kueue
  settings:
    # Trust release definitions only after they merge to the default branch.
    pipelinerun_provenance: default_branch
    policy:
      ok_to_test:
      - tekton-kueue-maintainers
      - plumbing-maintainers
      pull_request:
      - tekton-kueue-maintainers
  incoming:
  - targets:
    - release-v*
    secret:
      name: pac-incoming-secret
    type: webhook-url
    params:
    - version
    - release_as_latest
