---
# Trigger for /ci area commands
- op: replace
  path: /spec/interceptors/0/params/0/value
  value: >-
    body.comment.body.matches('^/ci area [A-Za-z0-9][-A-Za-z0-9]*\\s*$|^/ci remove-area [A-Za-z0-9][-A-Za-z0-9]*\\s*$')
- op: replace
  path: /metadata/name
  value: slash-command-area
- op: replace
  path: /spec/template/ref
  value: slash-command-area
