---
# Trigger for /ci milestone commands
- op: replace
  path: /spec/interceptors/0/params/0/value
  value: >-
    body.comment.body.matches('^/ci milestone [A-Za-z0-9][A-Za-z0-9 ._-]*\\s*$')
- op: replace
  path: /metadata/name
  value: slash-command-milestone
- op: replace
  path: /spec/template/ref
  value: slash-command-milestone
